name: Linux app

# Builds Sonara for Linux (x86_64): a .deb for Debian, Ubuntu and Mint, and an AppImage for the
# rest. jpackage only packages for the system it runs on. Built on the older Ubuntu so the .deb's
# dependencies have the names both older and newer releases know.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the files to this release (a version tag, e.g. v2.4.2); empty: don't"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build .deb and AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image already has what the build needs; apt runs only for what is missing, since
      # Ubuntu's mirrors are sometimes unreachable from GitHub for an hour or more. A missing
      # required package is tried a few times (Ubuntu's own archive from the second try on), each
      # try time-limited; x11-utils (xprop, for a look at the window class) never holds the build up.
      - name: Packaging and test tools
        timeout-minutes: 15
        run: |
          missing() { for p in "$@"; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done; }
          apt_try() {
            sudo timeout 150 apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=10 &&
              sudo timeout 150 apt-get install -y -o Acquire::Retries=1 -o Acquire::http::Timeout=10 "$@"
          }
          required=$(missing fakeroot xvfb imagemagick dbus libglib2.0-bin)
          if [ -n "$required" ]; then
            for attempt in 1 2 3 4; do
              apt_try $required $(missing x11-utils) && exit 0
              echo "Ubuntu's mirror didn't answer (try $attempt); trying Ubuntu's own archive in 20 s"
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
              sleep 20
            done
            exit 1
          fi
          optional=$(missing x11-utils)
          if [ -n "$optional" ]; then apt_try $optional || echo "Skipping $optional: Ubuntu's mirror didn't answer"; fi

      - name: Test
        run: xvfb-run -a ./gradlew --console=plain -p desktop test

      - name: Build the .deb and the app folder
        run: ./gradlew --console=plain -p desktop packageDeb createDistributable

      - name: Build the AppImage
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p out
          APPIMAGE_EXTRACT_AND_RUN=1 desktop/linux/make_appimage.sh \
            desktop/build/compose/binaries/main/app/Sonara \
            desktop/src/main/resources/icon.png \
            "out/Sonara-$version-linux-x86_64.AppImage" \
            ./appimagetool
          for f in desktop/build/compose/binaries/main/deb/*.deb; do cp "$f" "out/Sonara-$version-linux-amd64.deb"; done
          ls -la out

      - name: Look inside the .deb
        run: |
          deb=$(ls out/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E "\.desktop|bin/Sonara|\.png"

      - name: Start it (signed out), with a desktop bus
        run: |
          chmod +x out/*.AppImage
          export SONARA_GUEST=1 APPIMAGE_EXTRACT_AND_RUN=1
          # A session bus on a socket file, as desktops have it (/run/user/<id>/bus).
          dbus-daemon --session --address="unix:path=$RUNNER_TEMP/session-bus" --fork --print-address
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNNER_TEMP/session-bus"
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            "$(ls out/*.AppImage)" > out/app.log 2>&1 &
            sleep 40
            import -window root out/linux-window.png
            echo "--- window class"; if command -v xprop >/dev/null; then xprop -name Sonara WM_CLASS || true; else echo "(xprop not installed)"; fi
            echo "--- media player on the bus"
            gdbus call --session --dest org.mpris.MediaPlayer2.sonara --object-path /org/mpris/MediaPlayer2 \
              --method org.freedesktop.DBus.Properties.GetAll org.mpris.MediaPlayer2 || true
            gdbus call --session --dest org.mpris.MediaPlayer2.sonara --object-path /org/mpris/MediaPlayer2 \
              --method org.freedesktop.DBus.Properties.Get org.mpris.MediaPlayer2.Player PlaybackStatus || true
            echo "--- play/pause, from the desktop"
            gdbus call --session --dest org.mpris.MediaPlayer2.sonara --object-path /org/mpris/MediaPlayer2 \
              --method org.mpris.MediaPlayer2.Player.PlayPause || true
          '
          echo "--- app log"; tail -n 60 out/app.log || true

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: Sonara-Linux
          path: |
            out/*.deb
            out/*.AppImage
          if-no-files-found: error

      # On a version tag the .deb and the AppImage go straight onto that release; the APK and
      # the .msi are added from the owner's PC. A manual run can name the release (when the tag's
      # own run failed), without moving the tag.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          tag="${RELEASE:-$GITHUB_REF_NAME}"
          case "$tag" in v[0-9]*) ;; *) echo "Not a version tag: $tag"; exit 1 ;; esac
          gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Sonara ${tag#v}" --notes "" || true
          gh release upload "$tag" out/*.deb out/*.AppImage -R "$GITHUB_REPOSITORY" --clobber

      - name: Upload the check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sonara-Linux-check
          path: |
            out/linux-window.png
            out/app.log
          if-no-files-found: ignore
