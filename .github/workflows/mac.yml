name: macOS app

# Builds Sonara's .dmg on a Mac, once on Apple Silicon and once on Intel: jpackage only packages
# for the system it runs on. The AI translator's key is built in (secrets/translator.sealed), so
# nothing needs setting up.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build .dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: intel
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the .dmg
        run: |
          uname -m
          ./gradlew --console=plain -p desktop packageDmg

      - name: Name it for its Mac
        run: |
          cd desktop/build/compose/binaries/main/dmg
          for f in Sonara-*.dmg; do mv "$f" "${f%.dmg}-mac-${{ matrix.arch }}.dmg"; done
          ls -la

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Sonara-macOS-${{ matrix.arch }}
          path: desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

      # On a version tag the .dmg goes straight onto that release; the APK and the .msi are
      # added from the owner's PC.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Sonara ${tag#v}" --notes "" || true
          gh release upload "$tag" desktop/build/compose/binaries/main/dmg/*.dmg -R "$GITHUB_REPOSITORY" --clobber
