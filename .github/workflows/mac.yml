name: macOS app

# Builds Sonara's .dmg on a Mac (Apple Silicon): jpackage only packages for the system it runs on.
# The AI translator's key is built in (secrets/translator.sealed), so nothing needs setting up.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build .dmg
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the .dmg
        run: ./gradlew --console=plain -p desktop packageDmg

      - name: Name it for Apple Silicon
        run: |
          cd desktop/build/compose/binaries/main/dmg
          for f in Sonara-*.dmg; do mv "$f" "${f%.dmg}-mac-arm64.dmg"; done
          ls -la

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Sonara-macOS
          path: desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
