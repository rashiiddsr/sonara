name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [rebuild, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug:
    name: Build FOSS debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew --console=plain :app:assembleFossDebug :app:testFossDebugUnitTest
        env:
          ERMUSIC_BUILD_COMMIT: ${{ github.sha }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: er-music-debug
          path: app/build/outputs/apk/foss/debug/*.apk
