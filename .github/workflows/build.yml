name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [rebuild, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug:
    name: Build FOSS debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The debug build signs with ~/.android/debug.keystore, which a fresh runner doesn't have.
      # This APK is only a check; releases are signed elsewhere.
      - name: Make a debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK and run unit tests
        run: ./gradlew --console=plain :app:assembleFossDebug :app:testFossDebugUnitTest
        env:
          ERMUSIC_BUILD_COMMIT: ${{ github.sha }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sonara-debug
          path: app/build/outputs/apk/foss/debug/*.apk
